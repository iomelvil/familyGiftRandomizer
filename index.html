<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Clarke family gift exchange</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E5EBE4; --panel:#F3F6F2; --ink:#1B2A22; --muted:#56665C; --line:#C6D1C7;
  --tag:#DCC195; --tag-edge:#B9975F; --tag-ink:#35240F; --tag-muted:#6F5533;
  --accent:#A32638; --accent-ink:#FFFFFF; --mark:#F6E08A;
  --kid-tag:#2F5A43; --kid-edge:#1C3A2A; --kid-ink:#F3EDDF; --kid-muted:#B7CDBF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13221A; --panel:#1B2E24; --ink:#E6EDE7; --muted:#9BAFA2; --line:#2E4739;
    --tag:#CDAE7C; --tag-edge:#A8884F; --tag-ink:#2B1D0C; --tag-muted:#5C4524;
    --accent:#E0566A; --accent-ink:#1A0A0D; --mark:#F2D66B;
    --kid-tag:#4C8563; --kid-edge:#2C5A40; --kid-ink:#F6F1E4; --kid-muted:#CFE0D4;
  }
}
:root[data-theme="dark"]{
  --bg:#13221A; --panel:#1B2E24; --ink:#E6EDE7; --muted:#9BAFA2; --line:#2E4739;
  --tag:#CDAE7C; --tag-edge:#A8884F; --tag-ink:#2B1D0C; --tag-muted:#5C4524;
  --accent:#E0566A; --accent-ink:#1A0A0D; --mark:#F2D66B;
    --kid-tag:#4C8563; --kid-edge:#2C5A40; --kid-ink:#F6F1E4; --kid-muted:#CFE0D4;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font:400 17px/1.5 "Karla",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:clamp(20px,5vw,56px) clamp(16px,4vw,40px) 64px}
h1,h2,.name,.hist-name{font-family:"Young Serif",Georgia,"Times New Roman",serif;font-weight:400}
h1{font-size:clamp(2rem,6vw,3.4rem);line-height:1.05;margin:0 0 .35em;letter-spacing:-.01em;max-width:14ch}
.lede{color:var(--muted);margin:0 0 28px;max-width:52ch}

.search{position:relative;max-width:560px}
.search label{display:block;font-weight:700;margin-bottom:6px}
.search input{width:100%;font:inherit;font-size:1.15rem;padding:14px 44px 14px 16px;border-radius:10px;
  border:2px solid var(--line);background:var(--panel);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--accent)}
.clear{position:absolute;right:8px;bottom:9px;border:0;background:none;color:var(--muted);
  font:inherit;font-size:1.4rem;line-height:1;width:34px;height:34px;border-radius:6px;cursor:pointer}
.clear[hidden]{display:none}

.years{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;margin:26px 0 4px;scrollbar-width:thin}
.years button{flex:none;font:inherit;font-weight:500;padding:8px 14px;border-radius:999px;cursor:pointer;
  border:1.5px solid var(--line);background:transparent;color:var(--ink)}
.years button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.years button:first-child{font-size:1.05rem}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.art{width:clamp(150px,22vw,240px);height:auto;display:block}
@media (max-width:640px){ .top{grid-template-columns:1fr} .art{display:none} }
.yearhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:18px 0 6px;border-bottom:2px solid var(--ink);padding-bottom:10px}
.yearhead .big{font-family:"Young Serif",Georgia,serif;font-size:clamp(3rem,10vw,5.5rem);line-height:.9}
.yearhead .sub{color:var(--muted)}

h2{font-size:1.5rem;margin:34px 0 14px;display:flex;gap:10px;align-items:baseline}
h2 small{font-family:"Karla",sans-serif;font-size:.95rem;color:var(--muted)}

.grid{list-style:none;margin:22px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tag{position:relative;background:var(--tag);color:var(--tag-ink);padding:14px 16px 14px 44px;
  clip-path:polygon(22px 0,100% 0,100% 100%,22px 100%,0 50%);
  border-radius:0 8px 8px 0;min-height:96px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.tag::before{content:"";position:absolute;left:18px;top:50%;width:12px;height:12px;margin-top:-6px;
  border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 2px var(--tag-edge)}
.tag.kid{background:var(--kid-tag);color:var(--kid-ink);padding-right:52px}
.tag.kid::before{box-shadow:inset 0 0 0 2px var(--kid-edge)}
.tag.kid .lbl{color:var(--kid-muted)}
.tag.kid mark{color:#2B1D0C}
.jr{position:absolute;top:9px;right:10px;font-family:"Young Serif",Georgia,serif;font-size:.8rem;line-height:1;
  padding:4px 6px 3px;border:1.5px solid currentColor;border-radius:4px;transform:rotate(-6deg);opacity:.9}
.row{display:flex;align-items:baseline;gap:8px;min-width:0}
.lbl{font-size:.8rem;color:var(--tag-muted);width:2.6em;flex:none}
.name{font-size:1.2rem;line-height:1.25;overflow-wrap:anywhere}
.row.to .name{font-size:1.02rem;font-family:"Karla",sans-serif;font-weight:700}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}

.history{margin-top:26px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:18px 20px}
.history[hidden]{display:none}
.history h3{margin:0 0 12px;font-size:1.1rem}
.hist-scroll{overflow-x:auto}
.hist-table{border-collapse:collapse;width:100%;min-width:320px}
.hist-table th{text-align:left;font-weight:700;color:var(--muted);font-size:.9rem;padding:0 12px 6px 0}
.hist-table td{border-top:1px dashed var(--line);padding:6px 12px 6px 0;vertical-align:baseline}
.hist-year{color:var(--muted);font-variant-numeric:tabular-nums;width:4em}
.hist-table tr.sel td{background:var(--bg)}
.hist-table tr.sel .hist-year{color:var(--accent);font-weight:700}
.hist-name{font-size:1.02rem}
.hist-none{color:var(--muted);font-style:italic}

.empty{margin:30px 0;padding:22px;border:2px dashed var(--line);border-radius:12px;color:var(--muted)}
.empty strong{color:var(--ink)}
footer{margin-top:48px;color:var(--muted);font-size:.9rem}
@media (max-width:520px){ .grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top"><div class="intro">
    <h1>Clarke family gift exchange</h1>

    <div class="search">

  </g>
</svg>
    </div>
    <div class="years" id="years" role="group" aria-label="Choose a year"></div>
  </header>

  <main>
    <div class="yearhead"><span class="big" id="bigYear"></span><span class="sub" id="yearSub"></span></div>
    <div id="results" aria-live="polite"></div>
    <section class="history" id="history" aria-live="polite" hidden>
      <h3 id="histTitle"></h3>
      <div class="hist-scroll"><table class="hist-table"><thead><tr><th scope="col">Year</th><th scope="col">Gives to</th><th scope="col">Gets from</th></tr></thead><tbody id="histList"></tbody></table></div>
    </section>
  </main>
  <footer id="foot"></footer>
</div>

<script>
var DATA_FILE = 'giftlist.csv';
fetch(DATA_FILE, { cache: 'no-cache' })
  .then(function(r){ if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(function(t){ if (!/^\s*Giver\s*,/i.test(t)) throw new Error('bad csv'); start(t); })
  .catch(function(){ start(document.getElementById('giftdata').textContent); });

function start(rawText){
  var raw = rawText.replace(/^\uFEFF/, '').trim();
  var lines = raw.split(/\r?\n/).filter(function(l){return l.trim();});
  var head = lines[0].split(',').map(function(s){return s.trim();});
  var years = head.slice(2);
  var people = lines.slice(1).map(function(l){
    var c = l.split(',').map(function(s){return s.trim();});
    var gifts = {};
    years.forEach(function(y,i){ var v = c[i+2]; gifts[y] = (!v || v === '-') ? null : v; });
    return { name:c[0], group:(c[1]||'').toLowerCase()==='k' ? 'kid' : 'adult', gifts:gifts };
  });

  var yearsEl = document.getElementById('years'), q = document.getElementById('q'),
      clearBtn = document.getElementById('clear'), results = document.getElementById('results');
  var state = { year: years[0], query: '' };

  try { var saved = localStorage.getItem('giftName'); if (saved) state.query = saved; } catch(e){}
  q.value = state.query;

  years.forEach(function(y,i){
    var b = document.createElement('button');
    b.type = 'button'; b.textContent = i === 0 ? y + ' (this year)' : y; b.dataset.year = y;
    b.addEventListener('click', function(){ state.year = y; render(); });
    yearsEl.appendChild(b);
  });

  function esc(s){ return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function hl(name, query){
    if (!query) return esc(name);
    var i = name.toLowerCase().indexOf(query.toLowerCase());
    if (i < 0) return esc(name);
    return esc(name.slice(0,i)) + '<mark>' + esc(name.slice(i,i+query.length)) + '</mark>' + esc(name.slice(i+query.length));
  }
  function matches(p, query){ return !query || p.name.toLowerCase().indexOf(query.toLowerCase()) >= 0; }

  function tag(p, query){
    return '<li class="tag' + (p.group === 'kid' ? ' kid' : '') + '">' + (p.group === 'kid' ? '<span class="jr">Jr.</span>' : '') + '<div class="row"><span class="lbl">From</span><span class="name">' + hl(p.name, query) +
      '</span></div><div class="row to"><span class="lbl">To</span><span class="name">' + hl(p.gifts[state.year], query) + '</span></div></li>';
  }

  function render(){
    var query = state.query.trim(), y = state.year;
    Array.prototype.forEach.call(yearsEl.children, function(b){ b.setAttribute('aria-pressed', b.dataset.year === y); });
    clearBtn.hidden = !query;

    var inYear = people.filter(function(p){ return p.gifts[y]; });
    document.getElementById('bigYear').textContent = y;
    document.getElementById('yearSub').textContent = inYear.length + ' people in the exchange';

    var matched = people.filter(function(p){ return matches(p, query); });
    // People who only ever appear as recipients (e.g. new this year) still count
    if (query && !matched.length){
      var seen = {};
      people.forEach(function(p){ years.forEach(function(yr){ var r = p.gifts[yr];
        if (r && !seen[r] && r.toLowerCase().indexOf(query.toLowerCase()) >= 0){ seen[r] = 1;
          matched.push({ name:r, group:'', gifts:{} }); } }); });
    }
    var hit = function(n){ return !!n && n.toLowerCase().indexOf(query.toLowerCase()) >= 0; };
    var shown = !query ? inYear : inYear.filter(function(p){ return hit(p.name) || hit(p.gifts[y]); });
    // Show the searched person's own tag (giving) before the tags where they receive
    shown = shown.slice().sort(function(a,b){ return (hit(b.name)?1:0) - (hit(a.name)?1:0); });

    // History panel: when the search narrows to one person
    var exact = matched.filter(function(p){ return p.name.toLowerCase() === query.toLowerCase(); });
    var one = exact.length === 1 ? exact[0] : (matched.length === 1 && query ? matched[0] : null);
    var hist = document.getElementById('history');
    if (one){
      document.getElementById('histTitle').textContent = one.name + ' through the years';
      var cell = function(n){ return n ? '<span class="hist-name">' + esc(n) + '</span>' : '<span class="hist-none">not in it</span>'; };
      document.getElementById('histList').innerHTML = years.map(function(yr){
        var from = people.filter(function(p){ return p.gifts[yr] === one.name; }).map(function(p){ return p.name; }).join(', ');
        return '<tr class="' + (yr === y ? 'sel' : '') + '"><td class="hist-year">' + yr + '</td><td>' +
          cell(one.gifts[yr]) + '</td><td>' + cell(from) + '</td></tr>';
      }).join('');
      hist.hidden = false;
    } else { hist.hidden = true; }

    if (!shown.length){
      if (query && matched.length){
        results.innerHTML = '<div class="empty"><strong>' + esc(matched.map(function(p){return p.name;}).join(', ')) +
          '</strong> ' + (matched.length > 1 ? "weren't" : "wasn't") + ' in the ' + y + ' exchange. Pick another year above.</div>';
      } else {
        results.innerHTML = '<div class="empty">No one named <strong>“' + esc(query) + '”</strong> is on the list. Check the spelling, or clear the search to see everyone.</div>';
      }
      return;
    }

    results.innerHTML = '<ul class="grid">' + shown.map(function(p){ return tag(p, query); }).join('') + '</ul>';
  }

  q.addEventListener('input', function(){
    state.query = q.value;
    try { localStorage.setItem('giftName', q.value.trim()); } catch(e){}
    render();
  });
  clearBtn.addEventListener('click', function(){
    q.value = ''; state.query = '';
    try { localStorage.removeItem('giftName'); } catch(e){}
    render(); q.focus();
  });

  document.getElementById('foot').textContent = 'Gift list covers ' + years[years.length-1] + '–' + years[0] + '.';
  render();
}
</script>
